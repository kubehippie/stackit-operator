# This rule is not used by the project stackit-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to postgres.stackit-operator.webhippie.de resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: stackit-operator
    app.kubernetes.io/managed-by: kustomize
  name: postgres-postgresuser-viewer-role
rules:
- apiGroups:
  - postgres.stackit-operator.webhippie.de
  resources:
  - postgresusers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - postgres.stackit-operator.webhippie.de
  resources:
  - postgresusers/status
  verbs:
  - get
