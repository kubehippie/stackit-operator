---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: postgresusers.postgres.stackit-operator.webhippie.de
spec:
  group: postgres.stackit-operator.webhippie.de
  names:
    kind: PostgresUser
    listKind: PostgresUserList
    plural: postgresusers
    singular: postgresuser
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.instanceName
      name: Instance
      type: string
    - jsonPath: .spec.username
      name: Username
      type: string
    - jsonPath: .status.userID
      name: UserID
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PostgresUser is the Schema for the postgresusers API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of PostgresUser
            properties:
              credentialsRef:
                description: |-
                  credentialsRef is a reference to the ServiceAccountCredentials or
                  ClusterServiceAccountCredentials resource used to authenticate
                  against the STACKIT API.
                properties:
                  kind:
                    default: ServiceAccountCredentials
                    description: |-
                      kind specifies whether the referenced credentials are namespaced
                      (ServiceAccountCredentials) or cluster-scoped
                      (ClusterServiceAccountCredentials).
                    enum:
                    - ServiceAccountCredentials
                    - ClusterServiceAccountCredentials
                    type: string
                  name:
                    description: name specifies the name of the referenced credentials
                      resource.
                    type: string
                  namespace:
                    description: |-
                      namespace specifies the namespace of the referenced
                      ServiceAccountCredentials resource. It is ignored (and must be empty)
                      when kind is ClusterServiceAccountCredentials, and defaults to the
                      namespace of the referencing resource when kind is
                      ServiceAccountCredentials and namespace is left empty.
                    type: string
                required:
                - name
                type: object
              instanceName:
                description: |-
                  instanceName is the name of the Postgres Flex instance the user
                  should be created on. The instance's STACKIT-assigned ID is resolved
                  automatically and stored in status.instanceID.
                type: string
              roles:
                description: |-
                  roles lists the database access levels granted to the user (e.g.
                  "login", "createdb", "read", "readwrite"). Refer to the Postgres Flex
                  List Roles endpoint for the roles available on a given instance.
                items:
                  type: string
