{{- if .Values.rbac.enable }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "chart.fullname" . }}-manager
  labels:
    {{- include "chart.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - configmaps
      - secrets
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - stackit-operator.webhippie.de
    resources:
      - clusterserviceaccountcredentials
      - serviceaccountcredentials
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - postgres.stackit-operator.webhippie.de
    resources:
      - postgresdatabases
      - postgresusers
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - stackit-operator.webhippie.de
    resources:
      - clusterserviceaccountcredentials/status
      - serviceaccountcredentials/status
    verbs:
      - get
  - apiGroups:
      - postgres.stackit-operator.webhippie.de
    resources:
      - postgresdatabases/status
      - postgresusers/status
    verbs:
      - get
  {{- if .Values.rbac.extraRules }}
  {{- toYaml .Values.rbac.extraRules | nindent 2 }}
  {{- end }}
{{- end -}}
