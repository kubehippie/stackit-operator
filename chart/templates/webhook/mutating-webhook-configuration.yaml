{{- if .Values.webhook.enable }}
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: {{ include "chart.fullname" . }}
  annotations:
    {{- if .Values.certmanager.enable }}
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "chart.fullname" . }}-webhook
    {{- end }}
webhooks:
- admissionReviewVersions:
  - v1
  clientConfig:
    service:
      name: {{ include "chart.fullname" . }}-webhook
      namespace: {{ .Release.Namespace }}
      path: /mutate-identity-stackit-operator-webhippie-de-v1alpha1-attributeimportermapper
  failurePolicy: Fail
  name: mattributeimportermapper-v1alpha1.kb.io
  rules:
  - apiGroups:
    - identity.stackit-operator.webhippie.de
    apiVersions:
    - v1alpha1
    operations:
    - CREATE
    - UPDATE
    resources:
    - attributeimportermappers
  sideEffects: None
{{- end }}
